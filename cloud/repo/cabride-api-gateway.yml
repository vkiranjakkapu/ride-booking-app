platform:
  security:
    cors:
      enabled: true
      allowed-origin-patterns:
        - http://localhost:5173
        - http://localhost:5174,
        - http://localhost:4173,
        - http://localhost:4174,

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: cabride-identity-service
              uri: lb://cabride-identity-service
              predicates:
                - Path=/identity/**
