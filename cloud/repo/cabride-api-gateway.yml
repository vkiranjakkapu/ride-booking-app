server:
  forward-headers-strategy: framework

spring:
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: cabride-identity-service
              uri: lb://cabride-identity-service
              predicates:
                - Path=/identity/**

            - id: cabride-bookings-service
              uri: lb:ws://cabride-bookings-service
              predicates:
                - Path=/bookings/**
