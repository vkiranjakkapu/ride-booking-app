services:
  pgserver:
    image: postgres:latest
    container_name: pgserver
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: cabride_bookings
    ports:
    - "5432:5432"
    volumes:
    - pgdata_lab:/var/lib/postgresql
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
    - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
volumes:
  pgdata_lab:
  pgadmin_data:
networks:
  shared-network:
    external: true